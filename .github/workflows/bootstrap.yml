name: Bootstrap Cutrim Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Create Android Project
        run: |
          if [ ! -f settings.gradle.kts ]; then

            mkdir -p app/src/main/java/com/cutrim/app

            cat > settings.gradle.kts <<EOF
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name="Cutrim"
include(":app")
EOF

            cat > build.gradle.kts <<EOF
plugins {
    id("com.android.application") version "8.10.0" apply false
    id("org.jetbrains.kotlin.android") version "2.0.21" apply false
}
EOF

            cat > gradle.properties <<EOF
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
EOF

            cat > app/build.gradle.kts <<EOF
plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace="com.cutrim.app"
    compileSdk=35

    defaultConfig {
        applicationId="com.cutrim.app"
        minSdk=26
        targetSdk=35
        versionCode=1
        versionName="0.1"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
}
EOF

            cat > app/src/main/AndroidManifest.xml <<EOF
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:theme="@style/AppTheme"
        android:label="Cutrim">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

            mkdir -p app/src/main/res/values

            cat > app/src/main/res/values/styles.xml <<EOF
<resources>
<style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/>
</resources>
EOF

            cat > app/src/main/java/com/cutrim/app/MainActivity.kt <<EOF
package com.cutrim.app

import android.app.Activity
import android.os.Bundle
import android.widget.TextView

class MainActivity : Activity() {

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        val text = TextView(this)
        text.text = "Cutrim v0.1"
        text.textSize = 30f

        setContentView(text)
    }
}
EOF

          fi

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Commit Bootstrap
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .
          git commit -m "Bootstrap Cutrim Android project" || true
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cutrim-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
