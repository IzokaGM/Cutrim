name: Cutrim Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Bootstrap Cutrim project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "Cutrim project already exists. Skipping bootstrap."
            exit 0
          fi

          echo "Creating Cutrim Android project..."

          mkdir -p app/src/main/java/com/cutrim/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Cutrim"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > .gitignore <<'EOF'
          .gradle/
          .idea/
          local.properties
          */build/
          build/
          *.iml
          *.apk
          *.aab
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.cutrim.app"
              compileSdk = 37

              defaultConfig {
                  applicationId = "com.cutrim.app"

                  minSdk = 26
                  targetSdk = 37

                  versionCode = 1
                  versionName = "0.1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Cutrim"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/cutrim/app/MainActivity.kt <<'EOF'
          package com.cutrim.app

          import android.app.Activity
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var selectedVideoText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  fun dp(value: Int): Int {
                      return (value * resources.displayMetrics.density).toInt()
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL

                      setPadding(
                          dp(24),
                          dp(72),
                          dp(24),
                          dp(24)
                      )

                      setBackgroundColor(
                          Color.rgb(9, 14, 18)
                      )
                  }

                  val logo = TextView(this).apply {
                      text = "CUTRIM"
                      textSize = 34f

                      setTextColor(
                          Color.rgb(34, 230, 199)
                      )

                      setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                      )

                      gravity = Gravity.CENTER
                  }

                  val subtitle = TextView(this).apply {
                      text = "Create. Edit. Share."
                      textSize = 16f

                      setTextColor(
                          Color.rgb(190, 198, 204)
                      )

                      gravity = Gravity.CENTER

                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          topMargin = dp(12)
                      }
                  }

                  val newProjectButton = Button(this).apply {
                      text = "New Project"
                      textSize = 17f
                      isAllCaps = false

                      setTextColor(Color.BLACK)

                      backgroundTintList =
                          ColorStateList.valueOf(
                              Color.rgb(34, 230, 199)
                          )

                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(58)
                      ).apply {
                          topMargin = dp(42)
                      }

                      setOnClickListener {
                          val intent =
                              Intent(Intent.ACTION_OPEN_DOCUMENT).apply {

                                  addCategory(
                                      Intent.CATEGORY_OPENABLE
                                  )

                                  type = "video/*"
                              }

                          startActivityForResult(
                              intent,
                              REQUEST_VIDEO
                          )
                      }
                  }

                  selectedVideoText = TextView(this).apply {
                      text = "No video selected"
                      textSize = 14f

                      setTextColor(
                          Color.rgb(145, 155, 162)
                      )

                      gravity = Gravity.CENTER

                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          topMargin = dp(24)
                      }
                  }

                  root.addView(logo)
                  root.addView(subtitle)
                  root.addView(newProjectButton)
                  root.addView(selectedVideoText)

                  setContentView(root)
              }

              @Deprecated("Deprecated in Android API but suitable for bootstrap")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == REQUEST_VIDEO &&
                      resultCode == RESULT_OK
                  ) {
                      val uri = data?.data

                      selectedVideoText.text =
                          if (uri != null) {
                              "Video selected ✓"
                          } else {
                              "Unable to read video"
                          }
                  }
              }

              companion object {
                  private const val REQUEST_VIDEO = 1001
              }
          }
          EOF

      - name: Create Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.6.0
          fi

          chmod +x gradlew

      - name: Build Cutrim APK
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Cutrim-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit generated project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .gitignore \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            app \
            gradle \
            gradlew \
            gradlew.bat

          if git diff --cached --quiet; then
            echo "No generated files to commit."
          else
            git commit -m "Bootstrap Cutrim Android project"
            git push
          fi
