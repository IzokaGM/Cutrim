name: Cutrim Auto Patch Build

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find root patch ZIP
        id: patch
        shell: bash
        run: |
          PATCH="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' \
            | sort -nr \
            | head -n1 \
            | cut -d' ' -f2-)"

          if [ -z "$PATCH" ]; then
            echo "No ZIP patch found in repo root."
            exit 1
          fi

          echo "file=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Using patch: $PATCH"

      - name: Apply patch to repo root
        shell: bash
        env:
          PATCH_FILE: ${{ steps.patch.outputs.file }}
        run: |
          python3 - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path

          root = Path(".").resolve()
          archive = Path(os.environ["PATCH_FILE"]).resolve()

          with zipfile.ZipFile(archive, "r") as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")

                  if not name or name.endswith("/"):
                      continue

                  target = (root / name).resolve()

                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if name == ".git" or name.startswith(".git/"):
                      raise SystemExit("Patch cannot modify .git")

                  file_type = (info.external_attr >> 16) & 0o170000
                  if file_type == stat.S_IFLNK:
                      raise SystemExit(f"Symlinks are not allowed: {name}")

              z.extractall(root)

          print(f"Applied patch: {archive.name}")
          PY

      - name: Remove uploaded patch ZIP
        shell: bash
        env:
          PATCH_FILE: ${{ steps.patch.outputs.file }}
        run: rm -f "$PATCH_FILE"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        shell: bash
        run: chmod +x gradlew

      - name: Build Cutrim APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit applied patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Apply Cutrim patch"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Cutrim-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
